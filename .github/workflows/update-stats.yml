name: Update Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate private-aware stats (jstrieb/github-stats Python pin)
        env:
          ACCESS_TOKEN: ${{ secrets.STATS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repo secret STATS_PAT. Create a classic PAT with repo + read:user (+ user:email recommended)."
            exit 1
          fi

          mkdir -p assets
          rm -rf /tmp/github-stats
          # Upstream rewrote to Zig; pin last working Python revision
          git clone --filter=blob:none --no-checkout https://github.com/jstrieb/github-stats.git /tmp/github-stats
          cd /tmp/github-stats
          git fetch --depth 1 origin 8561db79ee470242822eb359b3dc1f23e2e73dea
          git checkout 8561db79ee470242822eb359b3dc1f23e2e73dea

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python generate_images.py

          cp generated/overview.svg "$GITHUB_WORKSPACE/assets/overview.svg"
          cp generated/languages.svg "$GITHUB_WORKSPACE/assets/top-langs.svg"
          ls -la "$GITHUB_WORKSPACE/assets"

      - name: Download complementary public cards
        env:
          USERNAME: Abdelrahmanessam1254
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${USERNAME}&theme=tokyonight" -o assets/stats.svg
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=${USERNAME}&theme=tokyonight" -o assets/repos-per-language.svg
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=${USERNAME}&theme=tokyonight" -o assets/most-commit-language.svg
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=${USERNAME}&theme=tokyonight" -o assets/productive-time.svg
          curl -fsSL "https://github-readme-streak-stats.herokuapp.com/?user=${USERNAME}&theme=tokyonight&hide_border=true" -o assets/streak.svg
          ls -la assets

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub profile stats SVGs"
          file_pattern: assets/*.svg
